[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # The Supabase URL and anon key are public by design (they ship in the browser
  # bundle; access is enforced by Row-Level Security), so exclude them from
  # Netlify's secret scanning to keep builds from failing.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Official Netlify Next.js runtime — handles SSR, server actions, and middleware.
[[plugins]]
  package = "@netlify/plugin-nextjs"
